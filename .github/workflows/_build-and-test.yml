name: Build and test

on:
  workflow_call:
    inputs:
      customer-refresh-source-intake:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    env:
      MalievWorkspaceRoot: ${{ github.workspace }}/.dependencies
    steps:
      - name: Check out AuthService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Materialize reviewed customer refresh source before SDK
        if: inputs.customer-refresh-source-intake
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          echo 'Customer refresh intake is source-only: bounded native resource admission is not qualified.' >&2
          exit 2
          target="$RUNNER_TEMP/customer-refresh-intake-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 -B eng/customer-refresh-intake/controls/export_transport.py "$GITHUB_WORKSPACE" "$GITHUB_SHA" "$target" > "$RUNNER_TEMP/customer-refresh-transport.json"
          echo "CUSTOMER_REFRESH_OBSERVER_SOURCE=$target/observer-controls" >> "$GITHUB_ENV"
          git checkout --detach 85a00d4bb54cf95199ee67dfd97d2b168233ff68
          python3 -B -m unittest discover -s "$target/controls" -p test_intake.py
          python3 -B "$target/controls/intake.py" --checkout "$GITHUB_WORKSPACE" --packet "$target/auth-customer-refresh-setup-fence-source-v1-20261009" > "$RUNNER_TEMP/customer-refresh-intake.json"
          echo "CUSTOMER_REFRESH_INTAKE_CONTROLS=$target/controls" >> "$GITHUB_ENV"
      - name: Verify customer refresh source intake controls
        if: ${{ !inputs.customer-refresh-source-intake }}
        timeout-minutes: 2
        shell: bash
        run: |
          python3 -B -c "from pathlib import Path; p=Path('eng/customer-refresh-intake/controls'); [compile(f.read_bytes(),str(f),'exec') for f in sorted(p.glob('*.py'))]"
          python3 -B -m unittest discover -s eng/customer-refresh-intake/controls -p test_intake.py
          python3 -B -O -m unittest discover -s eng/customer-refresh-intake/controls -p test_intake.py
      - name: Check out Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 4517cf16f5f1159318e184969732d46eae4a8308
          path: .dependencies/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Check out Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          path: .dependencies/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Check out exact Customer producer for the profile-binding tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CustomerService
          ref: 4eedecd81d1d8dcb4f38d8f76e51e7e9cb2110be
          path: .dependencies/Legacy.Maliev.CustomerService
          persist-credentials: false
      - name: Check out exact read-only IAM admission source for component tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.IAMService
          ref: 4fe6642e5674013de9a3672505aec898fdcae0ed
          path: .dependencies/Maliev.IAMService
          persist-credentials: false
      - name: Check out accepted Defaults solely for the isolated genuine IAM HTTP graph
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 7b3099bf67d0f17e56cfdb3dcf36541304abaac2
          path: .dependencies/GenuineIamDefaults
          persist-credentials: false
      - name: Check out exact original Aspire dependency for genuine IAM HTTP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: 01d506203763b914e237268a8746f1406423df86
          path: .dependencies/Maliev.Aspire
          persist-credentials: false
      - name: Check out exact original messaging dependency for genuine IAM HTTP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: 559a00db0c7920a5247fdff60d4476ad23a9a501
          path: .dependencies/Maliev.MessagingContracts
          persist-credentials: false
      - name: Materialize immutable genuine IAM HTTP build copy
        shell: pwsh
        run: ./eng/Prepare-GenuineIamHttpSource.ps1 -CommittedSourceRoot .dependencies
      - name: Verify bounded PostgreSQL observation controls and capture baseline
        timeout-minutes: 1
        shell: bash
        run: |
          if [[ -n "${CUSTOMER_REFRESH_OBSERVER_SOURCE:-}" ]]; then
            python3 -B -c "import os; from pathlib import Path; p=Path(os.environ['CUSTOMER_REFRESH_OBSERVER_SOURCE']); [compile((p/n).read_bytes(),str(p/n),'exec') for n in ('observe_postgres_cleanup.py','test_observe_postgres_cleanup.py')]"
            python3 -B -m unittest discover -s "$CUSTOMER_REFRESH_OBSERVER_SOURCE" -p test_observe_postgres_cleanup.py
            python3 -B "$CUSTOMER_REFRESH_OBSERVER_SOURCE/observe_postgres_cleanup.py" --role before --directory artifacts/ordinary-postgres-cleanup
          else
            python3 -m py_compile scripts/observe_postgres_cleanup.py scripts/test_observe_postgres_cleanup.py
            python3 -m unittest discover -s scripts -p test_observe_postgres_cleanup.py
            python3 scripts/observe_postgres_cleanup.py --role before --directory artifacts/ordinary-postgres-cleanup
          fi
      - name: Validate .NET solution
        # The Customer API reference is test-only; no production project acquires it.
        uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/actions/dotnet-validate@e3a6093324a24968876782153286f52db8b29fd8
        with:
          solution: Legacy.Maliev.AuthService.slnx
          use-local-maliev-dependencies: 'true'
      - name: Capture bounded PostgreSQL lifecycle readback
        if: always()
        timeout-minutes: 1
        shell: bash
        run: |
          if [[ -n "${CUSTOMER_REFRESH_OBSERVER_SOURCE:-}" ]]; then
            python3 -B "$CUSTOMER_REFRESH_OBSERVER_SOURCE/observe_postgres_cleanup.py" --role after --directory artifacts/ordinary-postgres-cleanup
          else
            python3 scripts/observe_postgres_cleanup.py --role after --directory artifacts/ordinary-postgres-cleanup
          fi
      - name: Verify ten customer refresh regressions after normal build
        if: inputs.customer-refresh-source-intake
        timeout-minutes: 10
        shell: bash
        env:
          INTAKE_CONTROLS: ${{ env.CUSTOMER_REFRESH_INTAKE_CONTROLS }}
        run: |
          set -euo pipefail
          assembly="$GITHUB_WORKSPACE/Legacy.Maliev.AuthService.Tests/bin/Release/net10.0/Legacy.Maliev.AuthService.Tests.dll"
          before=$(sha256sum "$assembly")
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true --list-tests > "$RUNNER_TEMP/customer-refresh-discovery.txt"
          test "$before" = "$(sha256sum "$assembly")"
          python3 -B "$INTAKE_CONTROLS/discovery.py" "$assembly" "$RUNNER_TEMP/customer-refresh-discovery.txt" > "$RUNNER_TEMP/customer-refresh-discovery.json"
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter 'FullyQualifiedName~CustomerRefreshAdmissionTests.Refresh_RechecksInitialPasswordStateBeforeIssuance|FullyQualifiedName~LegacyIdentityReaderTests.FindActive_InitialPasswordState_DeniesOnlySetupRequiredCustomer|FullyQualifiedName~RefreshSessionIdentityBoundaryHttpTests.CustomerRefresh_CurrentInitialPasswordState_ControlsFamilyAdmissionOnly' \
            --logger 'trx;LogFileName=customer-refresh.trx' --results-directory artifacts/customer-refresh
          python3 -B "$INTAKE_CONTROLS/verify_trx.py" artifacts/customer-refresh/customer-refresh.trx "$assembly" "$RUNNER_TEMP/customer-refresh-discovery.txt" "$RUNNER_TEMP/customer-refresh-discovery.json"
      - name: Build and verify the genuine Auth Defaults IAM HTTP join
        timeout-minutes: 15
        shell: bash
        env:
          GENUINE_IAM_RESOURCE_LEDGER: ${{ github.workspace }}/artifacts/genuine-iam-resource-ledger
        run: |
          # Original IAM and accepted Legacy Defaults require different MassTransit majors.
          dotnet build acceptance/GenuineIamHost/GenuineIamHost.csproj \
            --configuration Release --warnaserror -p:GITHUB_ACTIONS=false -p:UseLocalMalievDependencies=true \
            -p:MalievWorkspaceRoot="${{ github.workspace }}/.genuine-iam-source"
          dotnet build acceptance/GenuineIamHttp.Tests/GenuineIamHttp.Tests.csproj \
            --configuration Release --warnaserror -p:GITHUB_ACTIONS=false -p:UseLocalMalievDependencies=true \
            -p:MalievWorkspaceRoot="${{ github.workspace }}/.genuine-iam-source"
          dotnet test acceptance/GenuineIamHttp.Tests/GenuineIamHttp.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false -p:UseLocalMalievDependencies=true \
            -p:MalievWorkspaceRoot="${{ github.workspace }}/.genuine-iam-source" \
            --filter "FullyQualifiedName~GenuineIamHttp_" \
            --logger "trx;LogFileName=genuine-iam-http-focus.trx" --results-directory artifacts/genuine-iam-http-focus
          dotnet test acceptance/GenuineIamHttp.Tests/GenuineIamHttp.Tests.csproj \
            --configuration Release --no-build --no-restore -p:GITHUB_ACTIONS=false -p:UseLocalMalievDependencies=true \
            -p:MalievWorkspaceRoot="${{ github.workspace }}/.genuine-iam-source" \
            --logger "trx;LogFileName=genuine-iam-http.trx" --results-directory artifacts/genuine-iam-http
          GITHUB_ACTIONS=false UseLocalMalievDependencies=true MalievWorkspaceRoot="${{ github.workspace }}/.genuine-iam-source" dotnet format acceptance/GenuineIamHttp.Tests/GenuineIamHttp.Tests.csproj \
            --verify-no-changes --no-restore --include acceptance/GenuineIamHttp.Tests
          GITHUB_ACTIONS=false UseLocalMalievDependencies=true MalievWorkspaceRoot="${{ github.workspace }}/.genuine-iam-source" dotnet format acceptance/GenuineIamHost/GenuineIamHost.csproj \
            --verify-no-changes --no-restore --include acceptance/GenuineIamHost
      - name: Verify normal IAM composition, workload, delegation and Web currency-grant boundaries
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalIam|FullyQualifiedName~QuotationInvoiceCapabilityHttpTests|FullyQualifiedName~InvoiceDelegationContractTests|FullyQualifiedName~NativeLoggingConsumerContractTests|FullyQualifiedName~DeliveryContractTests|FullyQualifiedName~ServiceAuthenticationTests|FullyQualifiedName~LegacyWebCurrencyPermissionHttpTests" \
            --logger "trx;LogFileName=normal-iam.trx" --results-directory artifacts/normal-iam
      - name: Verify interactive actor roles and scoped token isolation
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~EmployeeSessionIssuanceHttpTests" \
            --logger "trx;LogFileName=actor-roles.trx" --results-directory artifacts/actor-roles
      - name: Verify separate server-owned IAM service profile through normal HTTP and genuine guard
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~IamServiceProfile_" \
            --logger "trx;LogFileName=iam-service-profile.trx" --results-directory artifacts/iam-service-profile
      - name: Verify identity business ID and session claim preservation through normal HTTP
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalIdentityDatabaseIdContract_" \
            --logger "trx;LogFileName=identity-database-id-contract.trx" --results-directory artifacts/identity-database-id-contract
      - name: Verify genuine employee edit grants and actor isolation
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalEmployeeEditGrants_|FullyQualifiedName~NormalServiceExchange_DoesNotBecomeAnInteractiveActor|FullyQualifiedName~NormalScopedIssuers_DoNotBecomeInteractiveActors|FullyQualifiedName~NormalIssuer_UndefinedInteractiveKind_RefusesBeforeIssuance|FullyQualifiedName~NormalLoginAccounting_UnconfirmedEmployeeAndUnknownAccountHaveNoIdentityOrSessionEffects" \
            --logger "trx;LogFileName=employee-edit-grants.trx" --results-directory artifacts/employee-edit-grants
      - name: Verify invoice-bound capability financial authority through normal HTTP
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalInvoiceBoundCapability_" \
            --logger "trx;LogFileName=invoice-bound-capability.trx" --results-directory artifacts/invoice-bound-capability
      - name: Verify exact employee recovery callback token boundaries
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalRecovery_CallbackRoundtripPreservesExactToken_AlteredEncodingsNeverConsumeIt" \
            --logger "trx;LogFileName=recovery-callback.trx" --results-directory artifacts/recovery-callback
      - name: Verify historical authentication security boundaries
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalHistoricalSecurity_" \
            --logger "trx;LogFileName=historical-security.trx" --results-directory artifacts/historical-security
      - name: Verify read-only identity lockout deadlines through normal HTTP
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalReadOnlyLockout_" \
            --logger "trx;LogFileName=readonly-lockout.trx" --results-directory artifacts/readonly-lockout
      - name: Verify Web identity user validation through normal HTTP
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalWebIdentityUserPolicy_" \
            --logger "trx;LogFileName=web-identity-user-policy.trx" --results-directory artifacts/web-identity-user-policy
      - name: Verify employee reset password policy through normal HTTP
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~ResetPasswordPolicy_" \
            --logger "trx;LogFileName=employee-reset-password-policy.trx" --results-directory artifacts/employee-reset-password-policy
      - name: Verify administrative user validation through normal HTTP
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalAdministrativeIdentityPolicy_" \
            --logger "trx;LogFileName=administrative-identity-policy.trx" --results-directory artifacts/administrative-identity-policy
      - name: Verify administrative password creation through normal HTTP
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalAdministrativePasswordPolicy_" \
            --logger "trx;LogFileName=administrative-password-policy.trx" --results-directory artifacts/administrative-password-policy
      - name: Verify persistent login accounting through normal HTTP
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalLoginAccounting_" \
            --logger "trx;LogFileName=login-accounting.trx" --results-directory artifacts/login-accounting
      - name: Verify historical Identity password formats through normal HTTP
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalHistoricalPasswordFormat_" \
            --logger "trx;LogFileName=historical-password-formats.trx" --results-directory artifacts/historical-password-formats
      - name: Verify historical Identity canonical lookup and private rate partitions
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalHistoricalIdentityNormalization_" \
            --logger "trx;LogFileName=historical-identity-normalization.trx" --results-directory artifacts/historical-identity-normalization
      - name: Verify Production Auth Program unhandled HTTP incident contract
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalProgramUnhandledFailure_" \
            --logger "trx;LogFileName=program-unhandled-failure.trx" --results-directory artifacts/program-unhandled-failure
      - name: Verify canonical identity writers preserve historical ownership and receipts
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~CanonicalEmailOwnershipTests|FullyQualifiedName~EmployeeCanonicalWriteTests|FullyQualifiedName~CustomerCanonicalWriteTests|FullyQualifiedName~CanonicalWriterRecovery_|FullyQualifiedName~CanonicalWriterCustomerRecovery_|FullyQualifiedName~CanonicalHistoricalCollision_|FullyQualifiedName~NormalCanonicalIdentityWriter_" \
            --logger "trx;LogFileName=canonical-identity-writes.trx" --results-directory artifacts/canonical-identity-writes
      - name: Verify employee creation binds the selected persisted business profile
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalEmployeeProfileBinding_" \
            --logger "trx;LogFileName=employee-profile-binding.trx" --results-directory artifacts/employee-profile-binding
      - name: Verify authoritative Customer binding and receipt-first replay through both real hosts
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~NormalCustomerProfileBinding_" \
            --logger "trx;LogFileName=customer-profile-binding.trx" --results-directory artifacts/customer-profile-binding
      - name: Verify customer registration recovery preserves established links
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~ResolveRegistration_" \
            --logger "trx;LogFileName=registration-links.trx" --results-directory artifacts/registration-links
      - name: Verify confirmation recovery rechecks current customer lockout
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --filter "FullyQualifiedName~EmailConfirmationRecovery_" \
            --logger "trx;LogFileName=confirmation-lockout.trx" --results-directory artifacts/confirmation-lockout
      - name: Verify offline Auth manifest review scripts
        shell: pwsh
        run: ./eng/Test-AuthManifestReview.ps1
      - name: Verify coverage gate and evidence controls
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/coverage-evidence -Force | Out-Null
          & ./eng/Test-RawCoverageGate.ps1 | Tee-Object -FilePath artifacts/coverage-evidence/checker-controls.log
          & ./eng/Test-CoverageEvidence.ps1 | Tee-Object -FilePath artifacts/coverage-evidence/evidence-controls.log
      - name: Collect raw owned production coverage
        shell: bash
        run: |
          dotnet test Legacy.Maliev.AuthService.Tests/Legacy.Maliev.AuthService.Tests.csproj \
            --configuration Release --no-build --no-restore \
            -p:UseLocalMalievDependencies=true \
            --collect "XPlat Code Coverage" --settings eng/coverage.runsettings \
            --logger "trx;LogFileName=owned-raw.trx" --results-directory artifacts/owned-raw
      - name: Require raw coverage for each owned assembly
        shell: pwsh
        run: |
          $reports = @(& ./eng/Get-OwnedCoverageReport.ps1 -ResultsDirectory artifacts/owned-raw)
          if ($reports.Count -ne 1) { throw 'Expected exactly one complete owned coverage report.' }
          & ./eng/Assert-OwnedCoverage.ps1 -CoveragePath $reports[0].FullName |
            Tee-Object -FilePath artifacts/coverage-evidence/checker-results.log
      - name: Verify offline PostgreSQL design-time context discovery
        shell: pwsh
        run: ./eng/Test-IdentityDesignTime.ps1
      - name: Prepare private validation evidence
        if: always()
        shell: pwsh
        run: |
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/owned-raw -OutputDirectory artifacts/coverage-evidence
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/recovery-callback -OutputDirectory artifacts/coverage-evidence/recovery-callback
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/historical-security -OutputDirectory artifacts/coverage-evidence/historical-security
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/historical-password-formats -OutputDirectory artifacts/coverage-evidence/historical-password-formats
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/historical-identity-normalization -OutputDirectory artifacts/coverage-evidence/historical-identity-normalization
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/program-unhandled-failure -OutputDirectory artifacts/coverage-evidence/program-unhandled-failure
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/canonical-identity-writes -OutputDirectory artifacts/coverage-evidence/canonical-identity-writes
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/employee-profile-binding -OutputDirectory artifacts/coverage-evidence/employee-profile-binding
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/customer-profile-binding -OutputDirectory artifacts/coverage-evidence/customer-profile-binding
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/administrative-password-policy -OutputDirectory artifacts/coverage-evidence/administrative-password-policy
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/administrative-identity-policy -OutputDirectory artifacts/coverage-evidence/administrative-identity-policy
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/identity-database-id-contract -OutputDirectory artifacts/coverage-evidence/identity-database-id-contract
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/iam-service-profile -OutputDirectory artifacts/coverage-evidence/iam-service-profile
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/employee-edit-grants -OutputDirectory artifacts/coverage-evidence/employee-edit-grants
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/invoice-bound-capability -OutputDirectory artifacts/coverage-evidence/invoice-bound-capability
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/readonly-lockout -OutputDirectory artifacts/coverage-evidence/readonly-lockout
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/web-identity-user-policy -OutputDirectory artifacts/coverage-evidence/web-identity-user-policy
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/employee-reset-password-policy -OutputDirectory artifacts/coverage-evidence/employee-reset-password-policy
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/login-accounting -OutputDirectory artifacts/coverage-evidence/login-accounting
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/confirmation-lockout -OutputDirectory artifacts/coverage-evidence/confirmation-lockout
          & ./eng/Export-CoverageEvidence.ps1 -ResultsDirectory artifacts/registration-links -OutputDirectory artifacts/coverage-evidence/registration-links
      - name: Retain private validation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owned-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/coverage-evidence
            artifacts/genuine-iam-http
            artifacts/genuine-iam-http-focus
            artifacts/genuine-iam-resource-ledger
            artifacts/ordinary-postgres-cleanup/*.json
            .genuine-iam-source/source-manifest.json
          if-no-files-found: error
          retention-days: 3
