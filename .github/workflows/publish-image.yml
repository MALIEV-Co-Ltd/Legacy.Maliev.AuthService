name: Publish immutable image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-gate:
    if: vars.LEGACY_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Record planned-only state
        run: echo "Deployment remains gated until the full migration, capacity, secret, WIF, GitOps and staging gates pass."

  publish:
    permissions:
      contents: read
      actions: read
      id-token: write
    if: vars.LEGACY_DEPLOY_ENABLED == 'true'
    uses: MALIEV-Co-Ltd/Legacy.Maliev.Workflows/.github/workflows/publish-image.yml@d583f55473f47f72d33b51060fa5d14e0974daf5
    with:
      image: ${{ vars.LEGACY_ARTIFACT_REGISTRY }}/legacy-maliev-auth-service
      dockerfile: Legacy.Maliev.AuthService.Api/Dockerfile
      context: .
      environment: legacy-production
      workload-identity-provider: ${{ vars.LEGACY_WORKLOAD_IDENTITY_PROVIDER }}
      service-account: ${{ vars.LEGACY_AUTH_PUBLISHER_SERVICE_ACCOUNT }}
