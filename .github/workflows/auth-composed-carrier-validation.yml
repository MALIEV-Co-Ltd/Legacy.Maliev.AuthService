name: Auth43 closed carrier infrastructure validation
on:
  pull_request:
  workflow_dispatch:
    inputs:
      request_base64:
        description: Root-reviewed fresh one-run composed Auth request
        required: true
        type: string
      request_sha256:
        description: Exact Root-reviewed request SHA256
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('auth-carrier-source-{0}', github.event.pull_request.number) || 'auth-financial-iam-qualification' }}
  cancel-in-progress: false
jobs:
  carrier-source-controls:
    name: Auth carrier source controls
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      AUTH_SOURCE_ROOT: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compile the closed Python carrier inputs
        timeout-minutes: 1
        run: |
          set -euo pipefail
          ulimit -v 524288
          ulimit -t 30
          python3 -B -W error - <<'PY'
          import json
          from pathlib import Path
          root = Path.cwd()
          seal = json.loads((root/'eng/auth-composed-carrier/carrier-seal.json').read_bytes())
          names = {row['path'] for row in seal['packetFiles']}
          names.update(('eng/auth-composed-carrier/entry.py', 'eng/auth-composed-carrier/test_entry.py',
                        'eng/customer-self-identity-validation/test_native_toolchain.py'))
          python_names = sorted(name for name in names if name.endswith('.py'))
          for name in python_names:
              compile((root/name).read_bytes(), name, 'exec')
          print(f'{len(python_names)} closed Python inputs compiled')
          PY
      - name: Publication guard and composed route controls
        timeout-minutes: 3
        run: |
          set -euo pipefail
          ulimit -v 524288
          ulimit -t 30
          python3 -B -W error eng/auth-composed-carrier/test_entry.py
          python3 -B -O -W error eng/auth-composed-carrier/test_entry.py
          python3 -B -W error eng/customer-self-identity-validation/test_route.py
          python3 -B -O -W error eng/customer-self-identity-validation/test_route.py
          python3 -B -W error eng/customer-self-identity-validation/test_native_toolchain.py
          python3 -B -O -W error eng/customer-self-identity-validation/test_native_toolchain.py
      - name: Install the pinned workflow linter
        timeout-minutes: 3
        env:
          GOTOOLCHAIN: go1.26.9
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Lint the additive carrier workflow
        timeout-minutes: 1
        run: '"$(go env GOPATH)/bin/actionlint" -shellcheck= .github/workflows/auth-composed-carrier-validation.yml'
  auth-identity:
    if: github.repository == 'MALIEV-Co-Ltd/Legacy.Maliev.AuthService' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exact request and source controls before allocation
        timeout-minutes: 3
        env:
          AUTH_SOURCE_ROOT: ${{ github.workspace }}
          REQUEST_BASE64: ${{ inputs.request_base64 }}
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
        run: |
          set -euo pipefail
          ulimit -v 524288
          ulimit -t 30
          python3 -B eng/auth-composed-carrier/entry.py
          python3 -B eng/auth-composed-carrier/test_entry.py
          python3 -B eng/customer-self-identity-validation/test_route.py
          python3 -B -O eng/customer-self-identity-validation/test_route.py
      - name: Provision the SDK using the existing accepted action
        timeout-minutes: 5
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.401
      - name: Exact Legacy.Maliev.AuthService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.AuthService
          ref: 2bd6a61bfce1d19310209c0d00b56d92f0abea91
          fetch-depth: 0
          path: .source-checkouts/Legacy.Maliev.AuthService
          persist-credentials: false
      - name: Exact Legacy.Maliev.ServiceDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 7edcd961024868513fd5f373cab3dcb261197f77
          fetch-depth: 0
          path: .source-checkouts/Legacy.Maliev.ServiceDefaults
          persist-credentials: false
      - name: Exact Legacy.Maliev.CompatibilityContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CompatibilityContracts
          ref: 78e48ffc4ee000df0510cba5e7c7a3c4c4d539d7
          fetch-depth: 0
          path: .source-checkouts/Legacy.Maliev.CompatibilityContracts
          persist-credentials: false
      - name: Exact Legacy.Maliev.CustomerService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.CustomerService
          ref: 4eedecd81d1d8dcb4f38d8f76e51e7e9cb2110be
          fetch-depth: 0
          path: .source-checkouts/Legacy.Maliev.CustomerService
          persist-credentials: false
      - name: Exact Maliev.IAMService
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.IAMService
          ref: 4fe6642e5674013de9a3672505aec898fdcae0ed
          fetch-depth: 0
          path: .source-checkouts/Maliev.IAMService
          persist-credentials: false
      - name: Exact GenuineIamDefaults
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.ServiceDefaults
          ref: 7b3099bf67d0f17e56cfdb3dcf36541304abaac2
          fetch-depth: 0
          path: .source-checkouts/GenuineIamDefaults
          persist-credentials: false
      - name: Exact Maliev.Aspire
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.Aspire
          ref: 01d506203763b914e237268a8746f1406423df86
          fetch-depth: 0
          path: .source-checkouts/Maliev.Aspire
          persist-credentials: false
      - name: Exact Maliev.MessagingContracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Maliev.MessagingContracts
          ref: 559a00db0c7920a5247fdff60d4476ad23a9a501
          fetch-depth: 0
          path: .source-checkouts/Maliev.MessagingContracts
          persist-credentials: false
      - name: Exact Legacy.Maliev.Workflows
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: MALIEV-Co-Ltd/Legacy.Maliev.Workflows
          ref: e3a6093324a24968876782153286f52db8b29fd8
          fetch-depth: 0
          path: .source-checkouts/Legacy.Maliev.Workflows
          persist-credentials: false
      - name: Manager-owned Auth validation and mandatory shutdown cleanup
        timeout-minutes: 90
        env:
          REQUEST_SHA256: ${{ inputs.request_sha256 }}
        run: |
          set -euo pipefail
          sudo -n --preserve-env=GITHUB_REPOSITORY,GITHUB_EVENT_NAME,GITHUB_SHA,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_REF,RUNNER_TEMP,REQUEST_SHA256 /usr/bin/python3 -B eng/customer-self-identity-validation/caller.py --role dispatch --source "$PWD" --evidence "$RUNNER_TEMP/auth-identity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain exact Auth validation and cleanup receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: auth-identity-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/auth-identity-${{ github.run_id }}-${{ github.run_attempt }}/**
            ${{ runner.temp }}/auth-identity-${{ github.run_id }}-${{ github.run_attempt }}.caller-intent.json
            ${{ runner.temp }}/auth-cs9-request-${{ github.run_id }}.json
          retention-days: 7
          if-no-files-found: error
