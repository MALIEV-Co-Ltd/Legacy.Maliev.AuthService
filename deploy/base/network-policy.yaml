apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: legacy-maliev-auth-service
  namespace: maliev-legacy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: legacy-maliev-auth-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: maliev-legacy
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: maliev-legacy
      ports:
        - protocol: TCP
          port: 5432
    # GoogleJsonWebSignature fetches Google's rotating certificates during
    # employee Google sign-in. Keep the egress surface to HTTPS only; the
    # endpoint IPs are intentionally not hard-coded because Google rotates
    # them and the verifier follows the public certificate endpoint.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
